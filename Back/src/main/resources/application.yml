server:
  port: ${PORT:8080}

spring:
  profiles:
    # Para usar H2 (en memoria, sin instalar nada): dejar vacio
    # Para conectar a MySQL: activar el perfil 'mysql' (ver application-mysql.yml)
    #   ej: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
    active: ${SPRING_PROFILES_ACTIVE:}

  application:
    name: padel-connect-backend

  datasource:
    url: jdbc:h2:mem:padeldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # Se puede sobreescribir con la variable de entorno JWT_SECRET en vez de
  # usar el valor por defecto de este repo.
  secret: ${JWT_SECRET:PadelConnectSecretKeyForJwtTokenGeneration2026SuperSecureKeyWithEnoughLength!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
